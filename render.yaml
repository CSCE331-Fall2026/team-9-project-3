services:
  - type: web
    name: team9-pos-api
    runtime: docker
    rootDir: src/api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: "8080"
